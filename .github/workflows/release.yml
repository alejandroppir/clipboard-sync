name: Release

# Builds, signs and publishes a version. See docs/publicar-version.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión, sin la v (ej. 2.0.1)"
        required: true
        type: string
      appName:
        description: "Nombre visible de la aplicación. Vacío = el de tauri.conf.json"
        required: false
        default: ""
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Repository the installed apps check for updates. It must be this one unless the code moves.
      RELEASE_REPO: alejandroppir/clipboard-sync
      # As variables, never inside a script: their text would be run as code.
      RELEASE_VERSION: ${{ inputs.version }}
      APP_NAME: ${{ inputs.appName }}
    steps:
      # Before building, which takes minutes. An existing tag would be reused as it is, pointing at other code.
      - name: Check that the version is not published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tags = gh api "repos/$env:RELEASE_REPO/git/matching-refs/tags/v$env:RELEASE_VERSION" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tags -contains "refs/tags/v$env:RELEASE_VERSION") { throw "The tag v$env:RELEASE_VERSION already exists." }

      # Pinned to a commit: a tag can be moved to other code, which would run next to the signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The build output is in the root `target/` (src-tauri/.cargo/config.toml).
          workspaces: "src-tauri -> ../target"

      - name: Install Node dependencies
        run: npm ci

      - name: Build, sign and package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -AppName $env:APP_NAME

      - name: Publish the GitHub release
        shell: pwsh
        env:
          # Another repository needs a token with access to it (secret RELEASE_TOKEN).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          # One by one: PowerShell does not expand `release/*` for other programs.
          $files = (Get-ChildItem release -File).FullName
          $arguments = @($tag) + $files + @("--repo", $env:RELEASE_REPO, "--title", $tag, "--notes-file", ".github/release-notes.md", "--latest")
          # The tag points at the built commit only when it lives in the same repository.
          if ($env:RELEASE_REPO -eq $env:GITHUB_REPOSITORY) { $arguments += @("--target", $env:GITHUB_SHA) }
          gh release create @arguments
