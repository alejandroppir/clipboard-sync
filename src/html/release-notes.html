<dialog class="dialog" id="release-notes" aria-labelledby="release-notes-title">
  <div class="dialog__body vstack gap-4">
    <h2 class="title" id="release-notes-title"></h2>
    <ul class="notes dialog__scroll vstack" id="release-notes-list"></ul>
    <div class="hstack end">
      <button type="button" class="btn btn--accent" id="release-notes-close" autofocus>Entendido</button>
    </div>
  </div>
</dialog>
